openapi: 3.1.0
info:
  title: Universal POS API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      operationId: login
      summary: Exchange tenant credentials for access and refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, email, password]
              properties:
                tenant_id: { type: string, format: uuid }
                email: { type: string, format: email }
                password: { type: string, minLength: 1 }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { description: Invalid request }
        '401': { description: Invalid credentials }
  /auth/pin-login:
    post:
      operationId: terminalPinLogin
      summary: Authenticate a user at a registered terminal using a PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, terminal_id, terminal_token, user_id, pin]
              properties:
                tenant_id: { type: string, format: uuid }
                terminal_id: { type: string, format: uuid }
                terminal_token: { type: string }
                user_id: { type: string, format: uuid }
                pin: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Authenticated terminal session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenPair'
                  - type: object
                    required: [user_id, tenant_id, branch_id, terminal_id]
                    properties:
                      user_id: { type: string, format: uuid }
                      tenant_id: { type: string, format: uuid }
                      branch_id: { type: string, format: uuid }
                      terminal_id: { type: string, format: uuid }
        '400': { description: Invalid request }
        '401': { description: Invalid terminal credentials, user, or PIN }
  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Rotate a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: Rotated token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { description: Invalid request }
        '401': { description: Invalid or expired refresh token }
  /terminals/register:
    post:
      operationId: registerTerminal
      summary: Register a terminal at a branch
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id, name]
              properties:
                branch_id: { type: string, format: uuid }
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '201':
          description: Registered terminal credentials (shown once)
          content:
            application/json:
              schema:
                type: object
                required: [terminal_id, terminal_token, branch_id]
                properties:
                  terminal_id: { type: string, format: uuid }
                  terminal_token: { type: string }
                  branch_id: { type: string, format: uuid }
        '400': { description: Invalid branch or registration request }
        '401': { description: Authentication required }
        '403': { description: Permission denied }
  /users/{userID}/pin:
    put:
      operationId: setUserPIN
      summary: Set or change a user's six-digit PIN
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '204': { description: PIN updated }
        '400': { description: Invalid request }
        '401': { description: Authentication required }
        '403': { description: Permission denied }
        '404': { description: User not found }
  /me/manifest:
    get:
      operationId: getManifest
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Tenant UI manifest
          content:
            application/json:
              schema:
                type: object
                required: [tenant_id, user_id, modules, capabilities, navigation]
                properties:
                  tenant_id: { type: string, format: uuid }
                  user_id: { type: string, format: uuid }
                  modules: { type: array, items: { type: string } }
                  capabilities: { type: array, items: { type: string } }
                  navigation: { type: array, items: { type: object } }
        '401': { description: Authentication required }
        '403': { description: Permission denied }
  /catalog/items:
    get:
      operationId: listCatalogItems
      summary: Search active sellable items
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        '200':
          description: Catalog page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CatalogItem' } }
                  next_cursor: { type: string, nullable: true }
        '401': { description: Authentication required }
    post:
      operationId: createCatalogItem
      summary: Create a catalog item and optional opening stock
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CatalogItemInput' } }
      responses:
        '201': { description: Item created }
        '400': { description: Invalid item }
  /shifts:
    post:
      operationId: openShift
      summary: Open a cashier shift
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                branch_id: { type: string, format: uuid }
                opening_float_minor: { type: integer, minimum: 0 }
      responses:
        '201': { description: Shift opened }
        '400': { description: Shift already open or invalid branch }
  /shifts/{shiftID}/close:
    post:
      operationId: closeShift
      summary: Blind-close a cashier shift
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: shiftID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: closing_cash_minor, in: query, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: Shift closed with variance }
        '400': { description: Invalid or already closed shift }
  /sales:
    post:
      operationId: completeCashSale
      summary: Atomically complete a cash sale
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1 } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/SaleInput' } }
      responses:
        '201': { description: Sale completed }
        '400': { description: Invalid sale, insufficient stock, or no open shift }
  /reports/daily:
    get:
      operationId: dailySalesReport
      summary: Read today's sales summary
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Daily sales, item count, and total }
  /sales/{saleID}/payments:
    post:
      operationId: allocateSalePayments
      summary: Allocate one or more tenders to an unpaid sale balance
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: saleID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenders]
              properties:
                tenders: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Tender' } }
      responses:
        '201': { description: Payment allocation captured }
        '400': { description: Invalid or unbalanced allocation }
  /payments/intents:
    post:
      operationId: initiateMpesaPayment
      summary: Initiate an idempotent M-Pesa STK payment intent
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sale_id, amount_minor, phone]
              properties:
                sale_id: { type: string, format: uuid }
                amount_minor: { type: integer, minimum: 1 }
                phone: { type: string }
                account_reference: { type: string }
      responses:
        '201': { description: Payment intent created }
  /payments/intents/{intentID}:
    get:
      operationId: getPaymentIntent
      summary: Read payment intent state
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: intentID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Payment intent state }
        '404': { description: Payment intent not found }
  /callbacks/mpesa/stk/{token}:
    post:
      operationId: receiveMpesaStkCallback
      summary: Receive token-authenticated Daraja STK callback
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Callback accepted or safely deduplicated }
        '404': { description: Invalid callback token }
  /callbacks/mpesa/c2b/{token}:
    post:
      operationId: receiveMpesaC2bConfirmation
      summary: Receive token-authenticated Daraja C2B confirmation
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Receipt accepted or retained for allocation }
  /callbacks/mpesa/c2b/validate/{token}:
    post:
      operationId: validateMpesaC2bPayment
      summary: Validate a token-authenticated Daraja C2B request
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Validation accepted }
  /payments/providers/mpesa:
    get:
      operationId: getMpesaConfiguration
      summary: Read M-Pesa configuration status without secrets
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Provider status }
    put:
      operationId: configureMpesa
      summary: Encrypt and save tenant Daraja credentials
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [environment, consumer_key, consumer_secret, business_short_code, passkey] }
      responses:
        '200': { description: Saved; tokenized provider callback URLs are returned once }
  /payments/providers/mpesa/c2b/register:
    post:
      operationId: registerMpesaC2bUrls
      summary: Register configured C2B callback URLs with Daraja
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: C2B URLs registered }
  /payments/unallocated/{paymentID}/allocate:
    post:
      operationId: allocateUnallocatedMpesaPayment
      summary: Assign an unmatched C2B receipt to a sale
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: paymentID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [sale_id], properties: { sale_id: { type: string, format: uuid } } }
      responses:
        '200': { description: C2B receipt allocated }
  /payments/unallocated:
    get:
      operationId: listUnallocatedPayments
      summary: Review matched and unallocated C2B payments
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Unallocated and resolved payment records }
  /reconciliation:
    get:
      operationId: listReconciliationRecords
      summary: Review imported statement reconciliation results
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Recent reconciliation records }
  /payments:
    get:
      operationId: listPayments
      summary: List payment intents for reconciliation
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Payment intents }
  /payments/refunds/{saleID}:
    post:
      operationId: refundPayment
      summary: Refund a captured sale amount
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: saleID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Refund recorded }
  /payments/refunds/{refundID}/approve:
    post:
      operationId: approveRefund
      summary: Approve a pending refund and post its ledger reversal
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: refundID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Refund completed }
        '400': { description: Refund is not approvable }
  /ledger/trial-balance:
    get:
      operationId: getTrialBalance
      summary: Read double-entry trial balance
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Balanced ledger totals }
  /reconciliation/import:
    post:
      operationId: importPaymentStatement
      summary: Import provider statement entries and report variances
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Reconciliation result }
        '400': { description: Invalid JSON or CSV statement }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    CatalogItemInput:
      type: object
      required: [name, sku, price_minor]
      properties:
        name: { type: string, minLength: 1 }
        sku: { type: string, minLength: 1 }
        barcode: { type: string }
        category_id: { type: string, format: uuid }
        kind: { type: string, enum: [stocked, service, non_inventory] }
        price_minor: { type: integer, minimum: 0 }
        cost_minor: { type: integer, minimum: 0 }
        stock_on_hand: { type: integer, minimum: 0 }
        reorder_level: { type: integer, minimum: 0 }
    CatalogItem:
      allOf:
        - $ref: '#/components/schemas/CatalogItemInput'
        - type: object
          required: [id, stock_on_hand, currency]
          properties:
            id: { type: string, format: uuid }
            currency: { type: string, minLength: 3, maxLength: 3 }
    SaleInput:
      type: object
      required: [lines, received_minor]
      properties:
        branch_id: { type: string, format: uuid }
        shift_id: { type: string, format: uuid }
        customer_name: { type: string }
        received_minor: { type: integer, minimum: 0 }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [item_id, quantity]
            properties:
              item_id: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
              discount_minor: { type: integer, minimum: 0 }
    Tender:
      type: object
      required: [method, amount_minor]
      properties:
        method: { type: string, enum: [cash, mpesa_stk, mpesa_c2b, credit] }
        amount_minor: { type: integer, minimum: 1 }
        reference: { type: string }
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { const: Bearer }
        expires_in: { type: integer, minimum: 1 }
